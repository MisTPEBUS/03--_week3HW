<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>付款結果</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
    }

    .result-list {
      margin-top: 1em;
      padding: 0;
      list-style: none;
    }

    .result-list li {
      margin-bottom: 0.5em;
    }

    .result-list li span {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>付款結果</h1>
  <div id="result">
    <!-- 付款結果將顯示在此處 -->
  </div>
  <script>
    // 取得 URL query 參數 (例如：?Status=SUCCESS&Amt=1000&MerchantOrderNo=ORDER123...)
    const params = new URLSearchParams(window.location.search);
    let resultHtml = '<h2>交易資訊：</h2><ul class="result-list">';

    // 將所有參數轉成清單呈現
    for (const [key, value] of params.entries()) {
      resultHtml += `<li><span>${key}</span>: ${value}</li>`;
    }
    resultHtml += '</ul>';

    // 顯示結果
    document.getElementById('result').innerHTML = resultHtml;
  </script>
</body>

</html>
