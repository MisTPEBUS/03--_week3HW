<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>購買商品</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>購買商品</h1>
    <form id="orderForm">
      <label>
        商品名稱：
        <input type="text" name="productName" required>
      </label>
      <label>
        數量：
        <input type="number" name="quantity" required min="1">
      </label>
      <!-- 其他商品/訂單資訊 -->
      <button type="submit">送出訂單</button>
    </form>
  </div>

  <script>
    document.getElementById('orderForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const productData = {};
      formData.forEach((value, key) => {
        productData[key] = value;
      });

      // 呼叫後端 API 來建立訂單與取得藍新金流付款所需參數
      fetch('https://foodiefund.onrender.com/create-order', {
        method: 'POST',
        // 建議開發時移除 no-cors 模式，確保能正常讀取回應內容
        // mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(productData)
      })
        .then(response => response.json())
        .then(data => {
          // 假設後端回傳以下資料：
          // data = { MerchantID, TradeInfo, TradeSha, Version }
          const newebpayUrl = 'https://ccore.newebpay.com/MPG/mpg_gateway';

          // 建立隱藏表單，將參數提交到藍新金流
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = newebpayUrl;

          const fields = {
            MerchantID: data.MerchantID,
            TradeInfo: data.TradeInfo,
            TradeSha: data.TradeSha,
            Version: data.Version
          };

          for (const key in fields) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
          }

          console.log(form)
          document.body.appendChild(form);
          /*  form.submit(); */
        })
        .catch(err => console.error('建立訂單錯誤:', err));
    });
  </script>
</body>

</html>
